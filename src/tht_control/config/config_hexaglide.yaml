env_param:
  n_actions: 6  #RL action space, 12 to include orientation as action, 6 to include upward motion
  action_dict: {
            '0': 'FRONT',
            '1': 'BACK',
            '2': 'RIGHT',
            '3': 'LEFT',
            '4': 'DOWN',
            '5': 'UP',
            '6': 'YAW_N',
            '7': 'YAW_P',
            '8': 'ROLL_P',
            '9': 'ROLL_N',
            '10': 'PITCH_P',
            '11': 'PITCH_N',
            '12': '2 x FRONT',
            '13': '2 x BACK',
            '14': '2 x RIGHT',
            '15': '2 x LEFT'
  }
  n_observations: 4 #RL observation space
  translation_step_mm: 0.5 # 0.5
  rotation_step_deg: 1 # Degrees
  x_punished_limit: [-0.0021, 0.0021]  # Outside this interval the agent will get strong negative rewards
  y_punished_limit: [-0.0021, 0.0021]  # Outside this interval the agent will get strong negative rewards
  image_as_input_without_cv: True
  metallic_pixel_detection: True
  diff_image_as_input: False
  pressure_hist_as_obs: False
  orientation_as_euler: False
  goal_error_coords: "Pixel" #Choose between "Pixel" and "EEF"
  max_step_count: 20
  max_pressure: 700 # 250
  max_depth: 2.1 # 1.5 (millimeters)
  click_goal_image: False  # Boolean: True for selecting goal position in image
  # Default selected goal in pixel values. Adjust when goal is changed.

  # Goal coordinates for Green PCB:
  #  Hole MP: C1: [688, 505], C2: [685, 505]
  #  Hole TG: C1: [595, 482], C2: [792, 489]
  #  Hole TY: C1: [578, 542], C2: [570, 490]
  #  Hole GY: C1: [809, 541], C2: [546, 531] (horizontal_shift_cam1=10, vertical_shift_cam1=0, horizontal_shift_cam2=-5, vertical_shift_cam2=0)
  #  Hole GG: C1: [751, 482], C2: [846, 531] (horizontal_shift_cam1=5, vertical_shift_cam1=0, horizontal_shift_cam2=10, vertical_shift_cam2=0)

  # Goal coordinates for ProServ PCB:
  # Hole A: C1: [596, 464], C2: [821, 497] (part reorientation: -3°)
  # Hole B: C1: [590, 484], C2: [719, 501] (part reorientation: -3°)
  # Hole C: C1: [582, 509], C2: [616, 498] (part reorientation: -3°)
  # Hole D: C1: [570, 549], C2: [515, 499] (part reorientation: -3°)
  # Hole E: C1: [727, 464], C2: [888, 531] (part reorientation: -6°)
  # Hole F: C1: [898, 538], C2: [490, 555] (part reorientation: -10°)

  goal_pixel_img1: [595, 482]  # Till 07.03.24: [596, 489]   # Clicked pixels: [(596, 489)]
  goal_pixel_img2: [792, 489]  # Till 07.03.24: [713, 482]   # Clicked pixels: [(719, 482])]
  goal_pixel_correction_img1 : [0, 0]   # [-20, 0] Correction additive term between clicked goal point and tilda axis error
  goal_pixel_correction_img2 : [0, 0]
  center_tolerance_px: 1
  vertical_shift_cam1: 0
  horizontal_shift_cam1: 0
  vertical_shift_cam2: 0
  horizontal_shift_cam2: 0


ros_param:
  img1_pub: '/cam_1/color/image_raw'
  img2_pub: '/cam_2/color/image_raw'
  cropped_img1_pub: 'cropped_img1'
  cropped_img2_pub: 'cropped_img2'
  cropped_img3_pub: 'cropped_img3'
  previous_cropped_img3_pub: 'previous_cropped_img3'
  action_pub: '/action'
  eef_state_pub: '/eef_state_hexaglide'   # Defined in robot_state_publisher.py
  move_to_pose_pub: '/move_to_pose_hexaglide'
  record_joint_pos_pub: '/record_joint_pos'
  move_to_joint_pose_pub: '/move_to_joint_pose'
  rl_init_pose_pub: '/rl_init_pose'


robot_workspace:
  x_limit: [-0.055, 0.055]    # Unit: Meters
  y_limit: [-0.055, 0.055]
  z_limit: [-0.08, 0.08]
  thetax_limit: [-15, 15]   # Unit: Degrees
  thetay_limit: [-15, 15]
  thetaz_limit: [-40, 40]
  deltaX_safe_limit: [55, 55, 55, 15, 15, 40]  # Max absolute change in EEF [x, y, z, theta_x, theta_y, theta_z]
  tildaorigin_to_pcb_z: -0.025  #For green PCB: -0.0245, For ProServe PCB: -0.24
  H1origin_to_tildaorigin: [0.009, 0.009, 0.063]  # in H1 coordinate frame (Unit: Meters)

log_param:
  output_dir: "testlogsmartassembly_hexaglide"

cropped_image_pixels:
  # h: 40 # Long pins (RL)
  h: 20 # Short pins (VSI)
  w: 40
  x3: 500   # for ProServ diode 480
  y3: 450   # for ProServ diode 430, for part WE-S 530
  h3: 256
  w3: 256
