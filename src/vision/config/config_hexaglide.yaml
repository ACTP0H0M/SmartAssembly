# TODO: Adjust extrinsic parameters according to hexaglide setup
extrinsic_params:
  d1: 113.5   # Distance from beam corner to camera 1 (114+-0.5)
  d2: 113.5   # Distance from beam corner to camera 2 (114+-0.5)
  x_hat_c1: 11.0  #28.7   # x-cordinate for camera 1 lens focal point in beam-corner coordinates
  y_hat_c2: 11.0  #28.7    # y-cordinate for camera 2 lens focal point in beam-corner coordinates
  z_hat: 20.5       #30.3 # z-coordinate of optical axis intersection in beam-corner coordinates
  rot_tilda_to_base: [[0, 1, 0], [-1, 0, 0], [0, 0, 1]]
  vertical_shift_cam1: 0  # 15 Tilt towards the PCB means corrected vertical pixel coordinate should be increased
  vertical_shift_cam2: 0  # -8
  horizontal_shift_cam1: 0
  horizontal_shift_cam2: 0
